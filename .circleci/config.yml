version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Run tests
          command: |
            python -m unittest discover

      - run:
          name: Check coverage
          command: |
            coverage run --branch -m unittest discover
            coverage report

workflows:
  build-and-test:
    jobs:
      - build-and-test